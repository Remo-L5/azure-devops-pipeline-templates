---
# Branch CI runs after merges; branch policies must disallow direct pushes.
# Every manual run targets production using the selected branch/revision.
trigger:
  branches:
    include:
      - dev
      - stage
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github-template-connection
      name: Remo-L5/azure-devops-pipeline-templates
      ref: refs/heads/main

parameters:
  - name: environments
    type: object
    default:
      - dev
      - stage
      - prod

stages:
  - ${{ each target in parameters.environments }}:
      - stage: release_${{ target }}
        displayName: Release API Ops (${{ target }})
        dependsOn: []
        condition: |
          and(
            succeeded(),
            or(
              and(
                eq('${{ target }}', 'prod'),
                eq(variables['Build.Reason'], 'Manual')
              ),
              and(
                in('${{ target }}', 'dev', 'stage'),
                in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'),
                eq(variables['Build.SourceBranch'], 'refs/heads/${{ target }}')
              )
            )
          )
        variables:
          - name: environment
            value: ${{ target }}
        jobs:
          - deployment: plan
            displayName: Dry-run API Ops
            pool:
              name: ado-devops-pool
            environment: apiops-plan-${{ target }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - template: /.pipelines/helpers/api-ops/plan.yaml@templates
                      parameters:
                        environment: ${{ variables.environment }}
                        serviceConnectionName: sc-apiops-${{ target }}
                        resourceGroupName: rg-apiops-${{ target }}
                        apimServiceName: apim-apiops-${{ target }}
                        apimServiceOutputFolderPath: artifacts
                        configurationFilePath: configuration.${{ target }}.yaml
          - deployment: deploy
            displayName: Publish API Ops
            dependsOn: plan
            condition: succeeded()
            pool:
              name: ado-devops-pool
            environment: apiops-${{ target }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - template: /.pipelines/helpers/api-ops/publish.yaml@templates
                      parameters:
                        environment: ${{ variables.environment }}
                        serviceConnectionName: sc-apiops-${{ target }}
                        resourceGroupName: rg-apiops-${{ target }}
                        apimServiceName: apim-apiops-${{ target }}
                        apimServiceOutputFolderPath: artifacts
                        configurationFilePath: configuration.${{ target }}.yaml
