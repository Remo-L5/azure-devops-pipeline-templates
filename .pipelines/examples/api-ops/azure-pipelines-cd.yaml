---
# Branch CI runs after merges; branch policies must disallow direct pushes.
# Every manual run targets production using the selected branch/revision.
trigger:
  branches:
    include:
      - dev
      - stage
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github-template-connection
      name: Remo-L5/azure-devops-pipeline-templates
      ref: refs/heads/main

variables:
  - name: environment
    ${{ if eq(variables['Build.Reason'], 'Manual') }}:
      value: prod
    ${{ elseif and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.SourceBranch'], 'refs/heads/dev')) }}:
      value: dev
    ${{ elseif and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.SourceBranch'], 'refs/heads/stage')) }}:
      value: stage
    ${{ else }}:
      # Unsupported triggers fail resource resolution instead of targeting Azure.
      value: none

extends:
  template: /.pipelines/cd-template.yaml@templates
  parameters:
    projects:
      - name: apiops
        projectType: api-ops
        projectSpecs:
          environment: ${{ variables.environment }}
          serviceConnectionName: sc-apiops-${{ variables.environment }}
          resourceGroupName: rg-apiops-${{ variables.environment }}
          apimServiceName: apim-apiops-${{ variables.environment }}
          apimServiceOutputFolderPath: artifacts
          configurationFilePath: configuration.${{ variables.environment }}.yaml
          planEnvironment: apiops-plan-${{ variables.environment }}
          deployEnvironment: apiops-${{ variables.environment }}
          poolName: ado-devops-pool
