---
parameters:
  - name: name
    type: string
  - name: dependencies
    type: object
    default: []
  - name: projectSpecs
    type: object
    default: {}
  - name: stageName
    type: string
    default: ''
  - name: stageDisplayName
    type: string
    default: ''
  - name: functionApp
    type: boolean
    default: false
  - name: validateOnly
    type: boolean
    default: false

stages:
  - stage: ${{ coalesce(parameters.stageName, parameters.name) }}
    displayName: ${{ coalesce(parameters.stageDisplayName, format('Deploy {0}', parameters.name)) }}
    dependsOn: ${{ parameters.dependencies }}
    pool:
      ${{ if ne(coalesce(parameters.projectSpecs.poolName, ''), '') }}:
        name: ${{ parameters.projectSpecs.poolName }}
      ${{ else }}:
        vmImage: ${{ coalesce(parameters.projectSpecs.vmImage, 'ubuntu-latest') }}
    jobs:
      - template: ../common/artifact-deployment-job.yaml
        parameters:
          azureDevOpsEnvironment: ${{ coalesce(parameters.projectSpecs.azureDevOpsEnvironment, '') }}
          validateOnly: ${{ parameters.validateOnly }}
          steps:
            - checkout: none
            - template: /.pipelines/helpers/app-service/deploy.yaml
              parameters:
                serviceConnectionName: ${{ parameters.projectSpecs.serviceConnectionName }}
                appName: ${{ parameters.projectSpecs.appName }}
                artifactName: ${{ parameters.projectSpecs.artifactName }}
                functionApp: ${{ parameters.functionApp }}
                validateOnly: ${{ parameters.validateOnly }}
                ${{ if parameters.functionApp }}:
                  appType: ${{ coalesce(parameters.projectSpecs.appType, 'functionAppLinux') }}
                ${{ else }}:
                  appType: ${{ coalesce(parameters.projectSpecs.appType, 'webAppLinux') }}
                resourceGroupName: ${{ coalesce(parameters.projectSpecs.resourceGroupName, '') }}
                slotName: ${{ coalesce(parameters.projectSpecs.slotName, '') }}
                isFlexConsumption: ${{ coalesce(parameters.projectSpecs.isFlexConsumption, false) }}
                runtimeStack: ${{ coalesce(parameters.projectSpecs.runtimeStack, '') }}
                startUpCommand: ${{ coalesce(parameters.projectSpecs.startUpCommand, '') }}
                appSettings: ${{ coalesce(parameters.projectSpecs.appSettings, '') }}
