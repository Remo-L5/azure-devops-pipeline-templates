parameters:
 - name: terraformWorkspace
   type: string
 - name: serviceConnection
 - name: root_module_folder_relative_path
   default: '.'

steps:
- task: AzureCLI@2
  displayName: Terraform Set Workspace
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: pscore
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    inlineScript: |
      $workspaceName="${{ parameters.terraformWorkspace }}"
      $modulePath = Join-Path $env:PIPELINE_WORKSPACE 'src'
      if ('${{ parameters.root_module_folder_relative_path }}' -and
        '${{ parameters.root_module_folder_relative_path }}' -ne '.' -and
        '${{ parameters.root_module_folder_relative_path }}' -ne '') {
        $modulePath = Join-Path $modulePath "${{ parameters.root_module_folder_relative_path }}"
      }
            
      # Change to module path before running workspace commands
      Push-Location $modulePath
            
      # Check if the workspace exists
      
      $existingWorkspaces = terraform workspace list

      if ($existingWorkspaces -match $workspaceName) {
          terraform workspace select $workspaceName
      } else {
          terraform workspace new $workspaceName
          terraform workspace select $workspaceName
      }