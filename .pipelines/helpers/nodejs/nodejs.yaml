---
parameters:
  - name: name
    type: string
    default: 'nodejs'
  - name: dependencies
    type: object
    default: []
  - name: projectSpecs
    type: object
    default: {}
  - name: stageName
    type: string
    default: ''
  - name: stageDisplayName
    type: string
    default: ''
  - name: poolName
    type: string
    default: ''
  - name: vmImage
    type: string
    default: 'ubuntu-latest'

stages:
  - stage: ${{ coalesce(parameters.stageName, parameters.name) }}
    displayName: ${{ coalesce(parameters.stageDisplayName, format('Build {0}', parameters.name)) }}
    ${{ if gt(length(parameters.dependencies), 0) }}:
      dependsOn: ${{ parameters.dependencies }}
    jobs:
      - job: build
        displayName: Build and test Node.js
        pool:
          ${{ if ne(coalesce(parameters.projectSpecs.poolName, parameters.poolName), '') }}:
            name: ${{ coalesce(parameters.projectSpecs.poolName, parameters.poolName) }}
          ${{ if eq(coalesce(parameters.projectSpecs.poolName, parameters.poolName), '') }}:
            vmImage: ${{ coalesce(parameters.projectSpecs.vmImage, parameters.vmImage) }}
        steps:
          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: ${{ coalesce(parameters.projectSpecs.nodeVersion, '24.x') }}

          - script: |
              npm install
              npm run build
            displayName: ${{ coalesce(parameters.projectSpecs.buildDisplayName, 'Node.js - install and build') }}
            workingDirectory: ${{ coalesce(parameters.projectSpecs.workingDirectory, './backend') }}

          - script: |
              npm audit --audit-level=${{ coalesce(parameters.projectSpecs.auditLevel, 'high') }}
            displayName: ${{ coalesce(parameters.projectSpecs.auditDisplayName, 'Node.js - audit check for high or critical package vulnerabilities') }}
            workingDirectory: ${{ coalesce(parameters.projectSpecs.workingDirectory, './backend') }}

          - script: |
              npm run ${{ coalesce(parameters.projectSpecs.testScript, 'test:ci') }}
            displayName: ${{ coalesce(parameters.projectSpecs.testDisplayName, 'Node.js - run unit tests') }}
            workingDirectory: ${{ coalesce(parameters.projectSpecs.workingDirectory, './backend') }}

          - ${{ if ne(coalesce(parameters.projectSpecs.publishArtifact, true), false) }}:
            - task: PublishPipelineArtifact@1
              displayName: ${{ coalesce(parameters.projectSpecs.publishDisplayName, 'Publish Node.js artifact') }}
              inputs:
                targetPath: ${{ coalesce(parameters.projectSpecs.artifactPath, './backend/dist') }}
                artifact: ${{ coalesce(parameters.projectSpecs.artifactName, parameters.name) }}
                publishLocation: pipeline
