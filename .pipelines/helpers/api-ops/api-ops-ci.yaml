---
parameters:
  - name: name
    type: string
  - name: dependencies
    type: object
    default: []
  - name: projectSpecs
    type: object
    default: {}
  - name: validationTargets
    type: object
    default: []
  - name: planStageName
    type: string
    default: ''
  - name: planStageDisplayName
    type: string
    default: ''
  - name: planEnvironment
    type: string
    default: 'apiops-plan'
  - name: poolName
    type: string
    default: 'ado-devops-pool'

stages:
  - ${{ if gt(length(parameters.validationTargets), 0) }}:
      - ${{ each target in parameters.validationTargets }}:
          - template: api-ops-ci-stage.yaml
            parameters:
              name: ${{ parameters.name }}
              dependencies: ${{ parameters.dependencies }}
              projectSpecs: ${{ parameters.projectSpecs }}
              planStageName: ${{ format('{0}_{1}', coalesce(parameters.planStageName, format('plan_{0}', parameters.name)), target.environment) }}
              planStageDisplayName: ${{ format('{0} ({1})', coalesce(parameters.planStageDisplayName, format('Plan {0}', parameters.name)), target.environment) }}
              planEnvironment: ${{ parameters.planEnvironment }}
              poolName: ${{ parameters.poolName }}
              target:
                environment: ${{ target.environment }}
                serviceConnectionName: ${{ target.serviceConnectionName }}
                planEnvironment: ${{ coalesce(target.planEnvironment, parameters.projectSpecs.planEnvironment, parameters.planEnvironment) }}
                # Literal connections are authorized before runtime target selection.
                condition: and(not(failed()), not(canceled()), eq(variables['environment'], '${{ target.environment }}'), ${{ coalesce(parameters.projectSpecs.condition, 'true') }})
  - ${{ else }}:
      - template: api-ops-ci-stage.yaml
        parameters:
          name: ${{ parameters.name }}
          dependencies: ${{ parameters.dependencies }}
          projectSpecs: ${{ parameters.projectSpecs }}
          planStageName: ${{ parameters.planStageName }}
          planStageDisplayName: ${{ parameters.planStageDisplayName }}
          planEnvironment: ${{ parameters.planEnvironment }}
          poolName: ${{ parameters.poolName }}
