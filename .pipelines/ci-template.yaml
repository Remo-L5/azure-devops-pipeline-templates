---
parameters:
  - name: projects
    type: object
    default: []
  - name: emptyDependencyList
    type: object
    default: []
  - name: emptySpecsObject
    type: object
    default: {}

stages:
  - ${{ each project in parameters.projects }}:
      - ${{ if eq(project.projectType, 'terraform') }}:
        - template: helpers/terraform/terraform-ci.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            stageName: ${{ coalesce(project.stageName, project.planStageName, '') }}
            stageDisplayName: ${{ coalesce(project.stageDisplayName, project.planStageDisplayName, '') }}
      - ${{ if eq(project.projectType, 'api-ops') }}:
        - template: helpers/api-ops/api-ops-ci.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            planStageName: ${{ coalesce(project.planStageName, '') }}
            planStageDisplayName: ${{ coalesce(project.planStageDisplayName, '') }}
            planEnvironment: ${{ coalesce(project.planEnvironment, 'apiops-plan') }}
      - ${{ if eq(project.projectType, 'dotnet') }}:
        - template: helpers/dotnet/dotnet.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            name: ${{ project.name }}
            stageName: ${{ coalesce(project.stageName, '') }}
            stageDisplayName: ${{ coalesce(project.stageDisplayName, '') }}
            webAppProjectsPath: ${{ coalesce(project.projectSpecs.webAppProjectsPath, '**/*.csproj') }}
            zipArtifactName: ${{ coalesce(project.projectSpecs.zipArtifactName, 'NOT_SET') }}
            dotnetVersion: ${{ coalesce(project.projectSpecs.dotnetVersion, '9.x') }}
            poolName: ${{ coalesce(project.projectSpecs.poolName, 'ado-devops-pool') }}
      - ${{ if eq(project.projectType, 'react') }}:
        - template: helpers/react/react.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            stageName: ${{ coalesce(project.stageName, '') }}
            stageDisplayName: ${{ coalesce(project.stageDisplayName, '') }}
      - ${{ if eq(project.projectType, 'nodejs') }}:
        - template: helpers/nodejs/nodejs.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            stageName: ${{ coalesce(project.stageName, '') }}
            stageDisplayName: ${{ coalesce(project.stageDisplayName, '') }}
      - ${{ if eq(project.projectType, 'static-web-app') }}:
        - template: helpers/static-web-app/static-web-app.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            stageName: ${{ coalesce(project.stageName, '') }}
            stageDisplayName: ${{ coalesce(project.stageDisplayName, '') }}
            validateOnly: true
      - ${{ if eq(project.projectType, 'powershell') }}:
        - template: helpers/powershell/azure-cli-powershell-check.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            checkStageName: ${{ coalesce(project.checkStageName, '') }}
            checkStageDisplayName: ${{ coalesce(project.checkStageDisplayName, '') }}
            checkEnvironment: ${{ coalesce(project.checkEnvironment, 'powershell-check') }}
      - ${{ if eq(project.projectType, 'api-ops-cli') }}:
        - template: helpers/api-ops-cli/api-ops-cli-ci.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            planStageName: ${{ coalesce(project.planStageName, '') }}
            planStageDisplayName: ${{ coalesce(project.planStageDisplayName, '') }}
            planEnvironment: ${{ coalesce(project.planEnvironment, 'apiops-plan') }}
      - ${{ if eq(project.projectType, 'api-center') }}:
        - template: helpers/api-center/api-center-ci.yaml
          parameters:
            dependencies: ${{ coalesce(project.dependencies, parameters.emptyDependencyList) }}
            projectSpecs: ${{ project.projectSpecs }}
            name: ${{ project.name }}
            validateStageName: ${{ coalesce(project.validateStageName, '') }}
            validateStageDisplayName: ${{ coalesce(project.validateStageDisplayName, '') }}
            validateEnvironment: ${{ coalesce(project.validateEnvironment, 'apicenter-validate') }}
